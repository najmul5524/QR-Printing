<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শপ লগইন | QR Se Print</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    <!-- Header -->
    <div class="p-6 bg-gradient-to-r from-pink-600 to-orange-500 text-white text-center">
      <div class="text-3xl mb-1">🖨️</div>
      <h1 class="text-2xl font-bold">QR Se Print শপ লগইন</h1>
      <p class="text-pink-100 text-sm mt-1">আপনার প্রদত্ত মোবাইল নম্বর ও পাসওয়ার্ড দিয়ে লগইন করুন</p>
    </div>

    <div class="p-6">
      {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm font-medium">
          ⚠️ {{ error }}
        </div>
      {% endif %}

      <!-- Login Form -->
      <form action="/login" method="POST" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">নিবন্ধিত মোবাইল নম্বর</label>
          <input type="tel" name="phone" required placeholder="017XXXXXXXX" class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-pink-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">পাসওয়ার্ড</label>
          <input type="password" name="password" required placeholder="••••••••" class="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-pink-500 outline-none text-sm">
        </div>
        <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-pink-600 to-orange-500 text-white font-bold rounded-lg shadow hover:opacity-95 transition">
          লগইন করুন
        </button>
      </form>

      <div class="mt-5 pt-4 border-t text-center space-y-2 text-xs text-gray-500">
        <p class="bg-gray-50 p-2.5 rounded-lg border text-gray-600">
          🔒 নতুন দোকানের অ্যাকাউন্ট খুলতে বা পাসওয়ার্ড পেতে কর্তৃপক্ষের (অ্যাডমিন) কাছ থেকে মোবাইল নম্বর ও পাসওয়ার্ড সংগ্রহ করুন।
        </p>
        <div class="flex items-center justify-between pt-1">
          <a href="/" class="hover:text-pink-600 font-semibold">← হোম পেজ</a>
          <a href="/superadmin" class="text-gray-400 hover:text-gray-700 font-semibold">🛡️ সুপার অ্যাডমিন কন্ট্রোল</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
