<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ফাইল ডাউনলোড | {{ shop.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white max-w-sm w-full rounded-2xl shadow-lg border border-gray-200 p-6 text-center space-y-4">
    <div class="w-16 h-16 mx-auto rounded-full bg-pink-50 border border-pink-200 flex items-center justify-center text-3xl">📥</div>
    <div>
      <p class="text-xs text-gray-500">{{ shop.name }} আপনাকে একটি ফাইল পাঠিয়েছে</p>
      <h1 class="font-bold text-lg text-gray-900 break-all mt-1">{{ t.filename }}</h1>
      <p class="text-sm text-gray-500 mt-1">{{ t.size_text }}</p>
    </div>

    {% if t.note %}
    <p class="text-sm bg-yellow-50 border border-yellow-200 text-yellow-900 rounded-xl p-3">{{ t.note }}</p>
    {% endif %}

    <a href="/t/{{ t.id }}/download"
       class="block w-full py-3.5 bg-gradient-to-r from-pink-600 to-orange-500 text-white font-bold rounded-xl shadow-lg shadow-pink-500/25">
      ⬇️ ফাইল ডাউনলোড করুন
    </a>

    <p class="text-xs text-gray-400">
      {% if t.one_time %}⚠️ একবার ডাউনলোড করলেই ফাইলটি সার্ভার থেকে মুছে যাবে।<br>{% endif %}
      লিংকের মেয়াদ শেষ হবে: <span id="exp" data-iso="{{ t.expires_at }}">{{ t.expires_at }}</span>
    </p>
  </div>
  <script>
    const el = document.getElementById('exp');
    const d = new Date(el.dataset.iso);
    if (!isNaN(d)) el.textContent = d.toLocaleString('bn-BD');
  </script>
</body>
</html>
