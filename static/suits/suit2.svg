<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="blueSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldTie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <!-- Light Blue Shirt -->
  <polygon points="150,110 250,110 215,280 185,280" fill="#e0f2fe" stroke="#93c5fd" stroke-width="2"/>
  <!-- Shirt Collar Left & Right -->
  <polygon points="150,110 185,150 160,180" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <polygon points="250,110 215,150 240,180" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <!-- Golden Tie -->
  <polygon points="190,140 210,140 216,165 184,165" fill="#f59e0b"/>
  <polygon points="186,165 214,165 220,340 200,375 180,340" fill="url(#goldTie)" stroke="#78350f" stroke-width="1"/>
  <!-- Navy Blue Suit Body -->
  <path d="M 150,110 L 40,165 L 10,400 L 390,400 L 360,165 L 250,110 L 225,230 L 200,280 L 175,230 Z" fill="url(#blueSuit)"/>
  <!-- Lapel Left -->
  <polygon points="150,110 90,180 165,225 180,270 200,280 190,240 160,170" fill="#1e40af" stroke="#172554" stroke-width="2"/>
  <!-- Lapel Right -->
  <polygon points="250,110 310,180 235,225 220,270 200,280 210,240 240,170" fill="#1e40af" stroke="#172554" stroke-width="2"/>
  <rect x="75" y="230" width="35" height="4" fill="#172554" rx="1"/>
  <polygon points="80,230 90,218 100,230" fill="#f8fafc"/>
</svg>
